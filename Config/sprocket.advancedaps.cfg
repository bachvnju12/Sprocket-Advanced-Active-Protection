# SAAPS 1.0.0 default configuration template. No user-specific values.
# Optional: copy to BepInEx/config/sprocket.advancedaps.cfg while game is closed.
# Do not overwrite an existing customized config. BepInEx creates defaults on first run.
# Builtin jam FOV: 30 degrees horizontal, 20 degrees vertical, module local +Z.
# Custom APS stores its own settings/presets; native placement/save-load acceptance pending.
# HUD/F7 rendering is not implemented; ShowHUD/ToggleHUD are reserved.

[General]
Enabled = true
DebugMode = false
ShowHUD = true
PerformanceLog = false

[Audio]
# Original synthetic firing SFX; not recordings of real APS hardware. 0 mutes.
LaunchVolume = 0.8

[Balance]
